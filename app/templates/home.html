{% extends "base.html" %}
{% block title %}首页 - 青禾流转{% endblock %}
{% block content %}
<section class="card">
  <h1>你好，{{ user.nickname }}</h1>
  <p class="page-lead">
    当前身份：<span class="role-tag role-{{ user.role }}">{{ user.role_label }}</span>
  </p>
  <p>可以开始使用：</p>
  <ul>
    <li><a href="{{ url_for('items.discover') }}">物品发现</a> — 浏览本校可共享物品</li>
    <li><a href="{{ url_for('items.new_item') }}">发布物品</a> — 让闲置继续被需要</li>
    <li><a href="{{ url_for('circulation.my_requests') }}">我的申请</a> — 跟进借还进度</li>
    <li><a href="{{ url_for('circulation.notifications') }}">通知</a> — 申请、交接与争议提醒</li>
  </ul>
</section>
{% endblock %}
