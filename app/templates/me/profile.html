{% extends "base.html" %}
{% block title %}个人资料 - 青禾流转{% endblock %}
{% block content %}
<section class="card">
  <h1>个人资料</h1>
  <p class="page-lead">昵称与头像修改随后续增量上线。</p>
  <dl class="profile-list">
    <div><dt>昵称</dt><dd>{{ user.nickname }}</dd></div>
    <div><dt>角色</dt><dd><span class="role-tag role-{{ user.role }}">{{ user.role_label }}</span></dd></div>
    <div><dt>登录账号</dt><dd>{{ account }}</dd></div>
  </dl>
</section>
{% endblock %}
