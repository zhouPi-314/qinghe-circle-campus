<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>青禾流转 · 校园物品共享流转</title>
  <meta name="description" content="青禾流转校园物品共享、二手交易、免费赠送与绿色回收平台设计原型。">
  <style>
    :root {
      --bg: #f7f2e8;
      --surface: #fffdf8;
      --forest: #235a3b;
      --leaf: #7bae7f;
      --sage: #dde8d7;
      --earth: #b66a3c;
      --ink: #24312a;
      --muted: #6e776f;
      --line: #ddd6c8;
      --blue: #2864a8;
      --orange: #c47a16;
      --red: #b53a2d;
      --success: #2d7a4f;
      --warning: #b7791f;
      --danger: #a33a32;
      --shadow: 0 14px 40px rgba(35, 90, 59, 0.11);
      --serif: "Noto Serif SC", "Source Han Serif SC", "Songti SC", serif;
      --sans: "Noto Sans SC", "Microsoft YaHei", sans-serif;
      --mono: "IBM Plex Mono", "Consolas", monospace;
    }

    * { box-sizing: border-box; }
    html { color-scheme: light; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      font-size: 15px;
      line-height: 1.65;
    }
    button, input, select, textarea { font: inherit; }
    button, a { -webkit-tap-highlight-color: transparent; }
    a { color: inherit; text-decoration: none; }
    button { cursor: pointer; }
    .app { min-height: 100vh; }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 30px;
      padding: 18px 42px;
      border-bottom: 1px solid rgba(221, 214, 200, 0.8);
      background: rgba(247, 242, 232, 0.92);
      backdrop-filter: blur(14px);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      min-width: 185px;
      font-family: var(--serif);
      font-size: 22px;
      font-weight: 700;
    }
    .brand-mark {
      position: relative;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--forest);
    }
    .brand-mark::before,
    .brand-mark::after {
      content: "";
      position: absolute;
      background: #f7f2e8;
      border-radius: 100% 0 100% 0;
      transform: rotate(-30deg);
    }
    .brand-mark::before { width: 13px; height: 8px; left: 7px; top: 9px; }
    .brand-mark::after { width: 10px; height: 6px; right: 6px; bottom: 8px; transform: rotate(145deg); }
    .nav {
      display: flex;
      align-items: center;
      gap: 24px;
      flex: 1;
      color: var(--muted);
    }
    .nav a.active { color: var(--forest); font-weight: 700; }
    .top-actions { display: flex; align-items: center; gap: 12px; }
    .avatar {
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--sage);
      color: var(--forest);
      font-family: var(--serif);
      font-weight: 700;
    }
    .role-line { display: flex; gap: 8px; align-items: center; }
    .role-tag {
      display: inline-flex;
      align-items: center;
      min-height: 22px;
      padding: 1px 8px;
      border: 1px solid currentColor;
      border-radius: 5px;
      font-size: 11px;
      font-weight: 700;
      line-height: 1;
    }
    .role-student { color: var(--blue); background: #edf4fc; }
    .role-station { color: var(--orange); background: #fff7e9; }
    .role-admin { color: var(--red); background: #fff0ee; }
    .role-university { color: #665a7a; background: #f3f0f7; }
    .shell { display: grid; grid-template-columns: 220px minmax(0, 1fr); max-width: 1420px; margin: 0 auto; }
    .sidebar {
      min-height: calc(100vh - 75px);
      padding: 30px 18px;
      border-right: 1px solid var(--line);
    }
    .sidebar-group { margin-bottom: 25px; }
    .sidebar-label { margin: 0 0 8px 12px; color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: 0.08em; }
    .side-link {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 8px;
      color: var(--muted);
    }
    .side-link.active { color: var(--forest); background: var(--sage); font-weight: 700; }
    .side-icon { width: 18px; text-align: center; }
    .main { padding: 36px 44px 80px; min-width: 0; }
    .page-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 24px; margin-bottom: 25px; }
    .page-head h1 { margin: 0 0 5px; font-family: var(--serif); font-size: 32px; line-height: 1.25; }
    .page-head p { margin: 0; color: var(--muted); }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 42px;
      padding: 9px 18px;
      border: 1px solid transparent;
      border-radius: 8px;
      font-weight: 700;
    }
    .btn-primary { color: #fff; background: var(--forest); }
    .btn-secondary { color: var(--forest); border-color: var(--forest); background: transparent; }
    .btn-ghost { color: var(--forest); border-color: var(--line); background: var(--surface); }
    .btn-danger { color: var(--danger); border-color: #d9aaa4; background: #fff9f8; }
    .btn-small { min-height: 34px; padding: 6px 12px; font-size: 13px; }
    .hero-a {
      display: grid;
      grid-template-columns: minmax(0, 1.65fr) minmax(280px, 0.75fr);
      align-items: stretch;
      gap: 30px;
      margin-bottom: 40px;
    }
    .hero-copy {
      padding: 42px 44px;
      border: 1px solid #cfdccc;
      border-radius: 18px;
      background:
        radial-gradient(circle at 95% 18%, rgba(123, 174, 127, 0.24), transparent 28%),
        var(--surface);
    }
    .hero-copy h1 {
      max-width: 780px;
      margin: 8px 0 16px;
      font-family: var(--serif);
      font-size: clamp(38px, 4.2vw, 62px);
      line-height: 1.18;
      letter-spacing: -0.03em;
    }
    .hero-copy p { max-width: 660px; margin: 0 0 25px; color: var(--muted); font-size: 17px; }
    .hero-note {
      display: grid;
      align-content: end;
      padding: 28px;
      border-radius: 18px;
      color: #f9f7ef;
      background: var(--forest);
      box-shadow: var(--shadow);
    }
    .hero-note strong { font-family: var(--serif); font-size: 28px; line-height: 1.3; }
    .hero-note small { margin-top: 35px; color: #dce8dc; }
    .mode-strip {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
      margin-bottom: 32px;
    }
    .mode-card {
      min-height: 146px;
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(255, 253, 248, 0.68);
    }
    .mode-card b { display: block; margin: 22px 0 5px; font-family: var(--serif); font-size: 18px; }
    .mode-card span { color: var(--muted); font-size: 13px; }
    .mode-glyph { color: var(--earth); font-family: var(--sans); font-size: 12px; }
    .search-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }
    .search-box {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 48px;
      padding: 0 16px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--surface);
      flex: 1;
    }
    .search-box input { width: 100%; border: 0; outline: 0; background: transparent; color: var(--ink); }
    .filter-chip {
      min-height: 48px;
      padding: 10px 15px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--surface);
      color: var(--muted);
    }
    .item-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
    .item-card {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--surface);
    }
    .item-visual {
      position: relative;
      height: 190px;
      overflow: hidden;
      background: #dce8d8;
    }
    .item-visual::before,
    .item-visual::after { content: ""; position: absolute; border-radius: 50%; }
    .item-visual::before { width: 170px; height: 170px; right: -35px; top: -35px; background: rgba(255,255,255,0.35); }
    .item-visual::after { width: 100px; height: 100px; left: 24px; bottom: -35px; background: rgba(35,90,59,0.12); }
    .item-visual.books { background: linear-gradient(135deg, #d6e6d1, #f3dfbd); }
    .item-visual.digital { background: linear-gradient(135deg, #d9e7e4, #c6d8de); }
    .item-visual.sports { background: linear-gradient(135deg, #f1d6be, #e2e9c7); }
    .item-visual.daily { background: linear-gradient(135deg, #e9dccf, #d7e8dc); }
    .object-label {
      position: absolute;
      left: 18px;
      bottom: 16px;
      z-index: 2;
      padding: 8px 10px;
      border: 1px solid rgba(35,90,59,0.25);
      border-radius: 6px;
      background: rgba(255,253,248,0.88);
      color: var(--forest);
      font-family: var(--serif);
      font-weight: 700;
    }
    .item-body { padding: 18px; }
    .item-meta { display: flex; justify-content: space-between; gap: 12px; align-items: center; }
    .item-body h3 { margin: 8px 0 8px; font-family: var(--serif); font-size: 21px; }
    .item-body p { margin: 0; color: var(--muted); font-size: 13px; }
    .tag {
      display: inline-flex;
      align-items: center;
      min-height: 26px;
      padding: 2px 9px;
      border-radius: 999px;
      background: #eef1e8;
      color: var(--forest);
      font-size: 12px;
      font-weight: 700;
    }
    .price { color: var(--earth); font-family: var(--sans); font-weight: 700; font-variant-numeric: tabular-nums; }
    .section-head { display: flex; justify-content: space-between; align-items: end; gap: 24px; margin: 35px 0 16px; }
    .section-head h2 { margin: 0; font-family: var(--serif); font-size: 27px; }
    .section-head p { margin: 3px 0 0; color: var(--muted); }
    .dense-layout { display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 24px; }
    .filter-panel { align-self: start; padding: 20px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
    .filter-panel h3 { margin: 0 0 14px; font-size: 15px; }
    .filter-panel label { display: block; margin: 12px 0; color: var(--muted); }
    .filter-panel input { margin-right: 8px; accent-color: var(--forest); }
    .list-row {
      display: grid;
      grid-template-columns: 92px minmax(0, 1fr) 120px;
      align-items: center;
      gap: 18px;
      padding: 16px;
      border-bottom: 1px solid var(--line);
      background: var(--surface);
    }
    .list-row:first-child { border-radius: 12px 12px 0 0; }
    .list-row:last-child { border-bottom: 0; border-radius: 0 0 12px 12px; }
    .list-thumb { width: 92px; height: 78px; border-radius: 8px; background: var(--sage); }
    .list-row h3 { margin: 0 0 4px; font-family: var(--serif); font-size: 19px; }
    .list-row p { margin: 0; color: var(--muted); font-size: 13px; }
    .list-action { text-align: right; }
    .mosaic {
      display: grid;
      grid-template-columns: 1.4fr 1fr 1fr;
      grid-auto-rows: 210px;
      gap: 16px;
    }
    .mosaic-card {
      position: relative;
      overflow: hidden;
      padding: 22px;
      border-radius: 20px;
      background: var(--surface);
      border: 1px solid var(--line);
    }
    .mosaic-card:nth-child(1) { grid-row: span 2; background: var(--forest); color: #fff; }
    .mosaic-card:nth-child(2) { background: #e7d5bd; }
    .mosaic-card:nth-child(3) { background: #dce8d8; }
    .mosaic-card:nth-child(4) { background: #ecd4c5; }
    .mosaic-card h3 { position: absolute; left: 22px; bottom: 20px; margin: 0; font-family: var(--serif); font-size: 25px; }
    .mosaic-card small { position: absolute; left: 22px; bottom: 52px; color: inherit; opacity: 0.7; }
    .detail-grid { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(300px, 0.7fr); gap: 24px; align-items: start; }
    .panel { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }
    .panel-pad { padding: 24px; }
    .gallery { overflow: hidden; border-radius: 14px; background: #dbe8d5; }
    .gallery-main { min-height: 420px; margin: 0; position: relative; overflow: hidden; background: linear-gradient(135deg, #c7dac1, #eddfc4); }
    .gallery-main img { display: block; width: 100%; height: 100%; min-height: 420px; object-fit: cover; }
    .gallery-main figcaption {
      position: absolute;
      left: 22px;
      bottom: 20px;
      padding: 7px 10px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.88);
      color: var(--ink);
      font-size: 12px;
    }
    .gallery-thumbs { display: flex; gap: 10px; padding: 12px; background: var(--surface); }
    .thumb { width: 70px; height: 55px; border-radius: 6px; background: var(--sage); }
    .sticky-action { position: sticky; top: 94px; }
    .action-block { padding: 25px; }
    .action-block h2 { margin: 0; font-family: var(--serif); font-size: 28px; }
    .action-block .lead { color: var(--muted); }
    .divider { height: 1px; margin: 20px 0; background: var(--line); }
    .owner { display: flex; align-items: center; gap: 12px; }
    .owner small { display: block; color: var(--muted); }
    .form-grid { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(290px, 0.55fr); gap: 24px; }
    .field { margin-bottom: 18px; }
    .field label { display: block; margin-bottom: 7px; font-weight: 700; }
    .field input,
    .field select,
    .field textarea {
      width: 100%;
      min-height: 46px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
    }
    .field textarea { min-height: 110px; resize: vertical; }
    .field small { display: block; margin-top: 5px; color: var(--muted); }
    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .upload-box {
      display: grid;
      place-items: center;
      min-height: 150px;
      border: 1px dashed #aab5a5;
      border-radius: 10px;
      background: #f9f7ef;
      color: var(--muted);
    }
    .timeline { position: relative; margin: 0; padding: 0 0 0 28px; list-style: none; }
    .timeline::before { content: ""; position: absolute; left: 7px; top: 9px; bottom: 10px; width: 2px; background: #cddccb; }
    .timeline li { position: relative; padding: 0 0 22px 8px; }
    .timeline li::before {
      content: "";
      position: absolute;
      left: -28px;
      top: 5px;
      width: 14px;
      height: 14px;
      border: 3px solid var(--bg);
      border-radius: 50%;
      background: #a7b4a3;
    }
    .timeline li.done::before { background: var(--forest); }
    .timeline li.current::before { background: var(--earth); box-shadow: 0 0 0 5px rgba(182,106,60,0.14); }
    .timeline b { display: block; }
    .timeline span { color: var(--muted); font-size: 13px; }
    .handover-box { padding: 20px; border-radius: 12px; background: #eef5e9; }
    .handover-code { margin: 12px 0 5px; color: var(--forest); font-family: var(--mono); font-size: 42px; letter-spacing: 0.18em; }
    .progress { height: 10px; overflow: hidden; border-radius: 999px; background: #e5eadf; }
    .progress > span { display: block; height: 100%; border-radius: inherit; background: var(--forest); }
    .charity-hero {
      padding: 34px;
      border-radius: 18px;
      color: #f9f7ef;
      background: linear-gradient(135deg, #244f38, #3f7658);
    }
    .charity-hero h1 { max-width: 740px; margin: 8px 0 12px; font-family: var(--serif); font-size: 42px; line-height: 1.2; }
    .charity-grid { display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 22px; margin-top: 22px; }
    .need-row { padding: 17px 0; border-bottom: 1px solid var(--line); }
    .need-row:last-child { border-bottom: 0; }
    .need-top { display: flex; justify-content: space-between; gap: 14px; margin-bottom: 11px; }
    .stat-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-bottom: 22px; }
    .stat { padding: 20px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
    .stat small { color: var(--muted); }
    .stat b { display: block; margin-top: 7px; font-family: var(--serif); font-size: 29px; }
    .todo-list { display: grid; gap: 12px; }
    .todo {
      display: grid;
      grid-template-columns: 44px minmax(0, 1fr) auto;
      align-items: center;
      gap: 14px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--surface);
    }
    .todo-index { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 50%; background: var(--sage); color: var(--forest); font-family: var(--sans); font-weight: 700; }
    .todo b { display: block; }
    .todo small { color: var(--muted); }
    .admin-main { max-width: 1280px; margin: 0 auto; padding: 34px 42px 80px; }
    .import-zone {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 25px;
      padding: 28px;
      border: 1px dashed #aab5a5;
      border-radius: 14px;
      background: var(--surface);
    }
    .data-table { width: 100%; border-collapse: collapse; background: var(--surface); }
    .data-table th,
    .data-table td { padding: 12px 14px; border-bottom: 1px solid var(--line); text-align: left; }
    .data-table th { color: var(--muted); background: #f2eee4; font-size: 12px; }
    .login-page {
      display: grid;
      grid-template-columns: minmax(0, 1.1fr) minmax(400px, 0.7fr);
      min-height: 100vh;
    }
    .auth-page {
      display: grid;
      grid-template-columns: minmax(0, 0.9fr) minmax(520px, 1.1fr);
      min-height: 100vh;
    }
    .auth-story {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 54px;
      color: #f8f5ea;
      background:
        radial-gradient(circle at 28% 78%, rgba(255,255,255,0.11), transparent 24%),
        linear-gradient(145deg, #234f37, #4b7e5e);
    }
    .auth-story h1 {
      max-width: 630px;
      margin: 16px 0;
      font-family: var(--serif);
      font-size: clamp(42px, 4.8vw, 66px);
      line-height: 1.16;
    }
    .auth-content {
      display: grid;
      align-content: center;
      padding: 54px 68px;
      background: var(--surface);
    }
    .auth-content h2 { margin: 0 0 8px; font-family: var(--serif); font-size: 36px; }
    .auth-content > p { margin: 0 0 28px; color: var(--muted); }
    .context-box {
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #fff;
    }
    .school-select {
      width: 100%;
      min-height: 50px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
    }
    .campus-options { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 14px; }

      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--muted);

    .context-school-meta { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0 18px; }
    .login-context {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 17px;
      padding: 7px 11px;
      border: 1px solid #cbd8ca;
      border-radius: 999px;
      color: var(--forest);
      background: #f3f8f0;
      font-size: 12px;
      font-weight: 700;
    }
    .muted-note { margin-top: 18px; color: var(--muted); font-size: 13px; text-align: center; }
    .login-art {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 54px;
      color: #f8f5ea;
      background:
        radial-gradient(circle at 75% 18%, rgba(255,255,255,0.15), transparent 25%),
        linear-gradient(145deg, #234f37, #4b7e5e);
    }
    .login-art h1 { max-width: 650px; margin: 18px 0; font-family: var(--serif); font-size: 56px; line-height: 1.18; }
    .login-art .brand-mark,
    .auth-story .brand-mark { background: #f7f2e8; }
    .login-art .brand-mark::before,
    .login-art .brand-mark::after,
    .auth-story .brand-mark::before,
    .auth-story .brand-mark::after { background: var(--forest); }
    .login-panel { display: grid; align-content: center; padding: 64px; background: var(--surface); }
    .login-panel h2 { margin: 0 0 8px; font-family: var(--serif); font-size: 34px; }
    .login-panel p { margin: 0 0 30px; color: var(--muted); }

      position: fixed;
      left: 50%;
      bottom: 18px;
      z-index: 99;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border-radius: 999px;
      background: #18251e;
      color: #f7f2e8;

    .proto-bar button, .proto-bar select {
      min-height: 34px;
      border: 0;
      border-radius: 999px;
      background: #33463a;
      color: #f7f2e8;
    }
    .proto-bar button { width: 34px; }
    .proto-bar select { padding: 0 12px; }
    .proto-label { min-width: 148px; text-align: center; font-size: 12px; }
    .hidden { display: none !important; }
    @media (max-width: 1060px) {
      .item-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .mode-strip { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .hero-a, .detail-grid, .form-grid, .charity-grid { grid-template-columns: 1fr; }
      .hero-note { min-height: 210px; }
      .shell { grid-template-columns: 180px minmax(0, 1fr); }
      .sticky-action { position: static; }
      .login-page { grid-template-columns: 1fr 410px; }
      .auth-page { grid-template-columns: 1fr 490px; }
      .login-art h1 { font-size: 44px; }
    }
    @media (max-width: 760px) {
      body { font-size: 14px; }
      .topbar { padding: 14px 18px; gap: 14px; }
      .brand { min-width: auto; font-size: 19px; }
      .nav { display: none; }
      .top-actions .btn { display: none; }
      .shell { display: block; }
      .sidebar { display: none; }
      .main, .admin-main { padding: 26px 18px 84px; }
      .hero-copy { padding: 30px 24px; }
      .hero-copy h1 { font-size: 38px; }
      .hero-a { gap: 16px; }
      .mode-strip, .item-grid, .stat-grid { grid-template-columns: 1fr; }
      .search-row { flex-wrap: wrap; }
      .search-box { flex-basis: 100%; }
      .filter-chip { flex: 1; }
      .dense-layout { grid-template-columns: 1fr; }
      .filter-panel { display: none; }
      .list-row { grid-template-columns: 76px minmax(0, 1fr); }
      .list-thumb { width: 76px; height: 64px; }
      .list-action { grid-column: 2; text-align: left; }
      .mosaic { grid-template-columns: 1fr; grid-auto-rows: 240px; }
      .mosaic-card:nth-child(1) { grid-row: span 1; }
      .two-col { grid-template-columns: 1fr; }
      .login-page { display: block; }
      .auth-page { display: block; }
      .auth-story { min-height: 300px; padding: 32px 25px; }
      .auth-content { padding: 38px 22px 76px; }
      .login-art { min-height: 320px; padding: 32px 25px; }
      .login-art h1 { font-size: 38px; }
      .login-panel { padding: 40px 24px 80px; }
      .import-zone { grid-template-columns: 1fr; }
      .data-table { font-size: 12px; }
      .proto-label { min-width: 100px; }
    }

    /* 6.2 visual system: campus circulation ledger */
    :root {
      --bg: #f2f6f7;
      --surface: #ffffff;
      --paper: #e5edef;
      /* legacy token name retained for prototype compatibility; the value is the current cool blue. */
      --forest: #28566c;
      --forest-deep: #173c50;
      --forest-soft: #3d7087;
      --leaf: #6fa793;
      --sage: #dcece8;
      --earth: #b94f35;
      --ink: #18262d;
      --muted: #5f6e74;
      --line: #d6e0e3;
      --line-strong: #99a9ae;
      --shadow: 0 18px 48px rgba(31, 70, 88, 0.13);
      --radius: 8px;
    }

    ::selection { color: #fff; background: var(--forest); }
    html { scrollbar-color: var(--line-strong) var(--bg); }
    body { font-size: 15px; line-height: 1.7; }
    button, a, input, select, textarea { border-radius: var(--radius); }
    input::placeholder, textarea::placeholder { color: #6a7168; opacity: 1; }
    :focus-visible { outline: 3px solid var(--earth); outline-offset: 3px; }

    .topbar {
      min-height: 72px;
      padding: 0 36px;
      gap: 34px;
      border-color: var(--line);
      background: rgba(242, 246, 247, 0.96);
      backdrop-filter: none;
    }
    .brand { min-width: 178px; font-size: 21px; letter-spacing: 0.02em; }
    .brand-mark { width: 30px; height: 30px; }
    .nav { gap: 28px; font-size: 14px; }
    .nav a { position: relative; min-height: 44px; display: inline-flex; align-items: center; }
    .nav a::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 5px;
      height: 2px;
      background: transparent;
    }
    .nav a.active::after { background: var(--forest); }
    .avatar {
      width: 36px;
      height: 36px;
      border: 1px solid var(--line-strong);
      background: transparent;
    }
    .role-tag {
      min-height: 24px;
      border-radius: 2px;
      background: transparent !important;
    }
    .btn {
      min-height: 44px;
      border-radius: 2px;
      transition: background 160ms ease, color 160ms ease, border-color 160ms ease;
    }
    .btn-small { min-height: 38px; }
    .btn-primary:hover { background: var(--forest-deep); }
    .btn-secondary:hover { color: #fff; background: var(--forest); }
    .btn-ghost:hover { background: var(--paper); }

    .shell {
      grid-template-columns: 206px minmax(0, 1fr);
      max-width: 1480px;
      border-left: 1px solid rgba(156, 162, 147, 0.35);
      border-right: 1px solid rgba(156, 162, 147, 0.35);
    }
    .sidebar {
      min-height: calc(100vh - 72px);
      padding: 32px 16px;
      background: rgba(229, 237, 239, 0.66);
    }
    .sidebar-label {
      margin: 0 10px 9px;
      color: #737c70;
      font-size: 11px;
      letter-spacing: 0.08em;
    }
    .side-link {
      min-height: 44px;
      padding: 9px 11px;
      border-radius: 2px;
      transition: background 160ms ease, color 160ms ease;
    }
    .side-link:hover { color: var(--ink); background: rgba(255, 253, 248, 0.6); }
    .side-link.active { background: var(--forest); color: #fff; }
    .side-icon { width: 20px; height: 20px; display: inline-grid; place-items: center; }
    .ui-icon { width: 18px; height: 18px; flex: 0 0 auto; }
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: 32px;
      margin-bottom: 18px;
      color: var(--muted);
      font-size: 13px;
    }
    .back-link:hover { color: var(--forest); }
    .main { padding: 42px 46px 92px; }
    .page-head { margin-bottom: 28px; }
    .page-head h1 {
      margin: 0 0 8px;
      font-size: clamp(34px, 3.4vw, 48px);
      line-height: 1.16;
      letter-spacing: -0.025em;
    }
    .page-head p { max-width: 72ch; }

    .hero-a {
      grid-template-columns: minmax(0, 1.55fr) minmax(280px, 0.55fr);
      gap: 0;
      margin-bottom: 30px;
      overflow: hidden;
      border-radius: 18px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }
    .hero-copy {
      padding: 54px 52px 46px;
      border: 0;
      border-radius: 0;
      background: var(--surface);
      color: var(--ink);
    }
    .hero-copy h1 {
      max-width: 820px;
      margin: 0 0 22px;
      font-size: clamp(44px, 3.7vw, 62px);
      line-height: 1.1;
      letter-spacing: -0.03em;
    }
    .hero-copy p {
      max-width: 60ch;
      margin-bottom: 28px;
      color: var(--muted);
      font-size: 16px;
    }
    .hero-copy .btn-primary { color: #fff; background: var(--forest); }
    .hero-copy .btn-secondary { color: var(--forest); border-color: var(--forest); }
    .hero-copy .btn-secondary:hover { color: #fff; background: var(--forest); }
    .hero-actions { display: flex; flex-wrap: wrap; gap: 10px; }
    .hero-note {
      position: relative;
      align-content: space-between;
      min-height: 360px;
      padding: 0;
      border-radius: 0;
      border-left: 0;
      background: var(--forest-deep);
      box-shadow: none;
      color: #fff;
      overflow: hidden;
    }
    .hero-note::after,
    .auth-story::after,
    .login-art::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background: linear-gradient(180deg, rgba(15, 41, 53, 0.08), rgba(15, 41, 53, 0.78));
    }
    .hero-note::before {
      content: "";
      position: absolute;
      z-index: 1;
      left: var(--glow-x, 70%);
      top: var(--glow-y, 25%);
      width: 260px;
      height: 260px;
      pointer-events: none;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(188, 235, 222, 0.34), transparent 68%);
      mix-blend-mode: screen;
      transform: translate(-50%, -50%);
      transition: left 420ms ease-out, top 420ms ease-out;
    }
    .hero-photo,
    .hero-video,
    .auth-photo {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .hero-video { z-index: 0; }
    .school-scene {
      animation: school-scene-drift 15s ease-in-out infinite alternate;
      transform-origin: center;
      will-change: transform;
    }
    .school-scene.is-paused { animation-play-state: paused; }
    @keyframes school-scene-drift {
      from { transform: scale(1.02) translate3d(-1.2%, 0.6%, 0); }
      to { transform: scale(1.1) translate3d(1.5%, -1.2%, 0); }
    }
    .hero-note .video-toggle { top: 16px; right: 16px; }
    .hero-note-content {
      position: relative;
      z-index: 2;
      display: grid;
      height: 100%;
      align-content: space-between;
      padding: 30px;
    }
    .hero-note strong { display: block; margin-bottom: 12px; font-size: 26px; }
    .hero-note small { display: block; color: #f3f7f8; line-height: 1.75; }
    .hero-note .hero-count {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 14px;
      padding-bottom: 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.45);
      color: #f2f7f8;
    }
    .hero-note .hero-count span {
      font-size: 12px;
      letter-spacing: 0.02em;
    }
    .hero-note .hero-count b { font-family: var(--serif); font-size: 70px; line-height: 0.8; }

    .mode-strip {
      gap: 12px;
      margin-bottom: 28px;
      border: 0;
    }
    .mode-card {
      min-height: 150px;
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--surface);
      transition: background 160ms ease;
    }
    .mode-card:hover { background: #f2f9fa; }
    .mode-card b { margin: 16px 0 7px; font-size: 20px; }
    .mode-top { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
    .mode-icon {
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      color: var(--forest);
      background: var(--sage);
    }
    .mode-icon .ui-icon { width: 20px; height: 20px; }
    .mode-glyph { color: var(--earth); font-family: var(--sans); font-size: 11px; letter-spacing: 0.04em; }

    .search-row {
      gap: 0;
      margin-bottom: 22px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--surface);
    }
    .search-box {
      min-height: 46px;
      border: 0;
      border-radius: 10px;
      background: #f2f7f8;
    }
    .search-box .ui-icon { color: var(--muted); }
    .filter-chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-height: 46px;
      border-color: var(--line);
      border-radius: 10px;
      background: transparent;
      color: var(--forest);
    }
    .filter-chip:hover { background: var(--sage); }
    .section-head {
      margin: 28px 0 16px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
    }
    .item-grid { gap: 18px; }
    .item-card {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--surface);
      box-shadow: 0 8px 24px rgba(31, 70, 88, 0.06);
    }
    .item-visual {
      height: 218px;
      overflow: hidden;
      border: 0;
      border-radius: 0;
      background: var(--sage);
    }
    .item-visual::after {
      inset: 0;
      width: auto;
      height: auto;
      border-radius: 0;
      background: linear-gradient(180deg, transparent 55%, rgba(12, 34, 43, 0.18));
    }
    .item-visual.books { background: #dfe8d8; }
    .item-visual.daily { background: #e9e1d3; }
    .item-visual.sports { background: #dfe9d6; }
    .item-visual.digital { background: #d9e4e5; }
    .item-visual img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 520ms cubic-bezier(0.22, 1, 0.36, 1);
    }
    .item-visual::before,
    .item-visual::after { display: none; }
    .object-label {
      left: 18px;
      bottom: 16px;
      z-index: 2;
      padding: 7px 10px;
      border: 1px solid rgba(40, 86, 108, 0.24);
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.86);
      color: var(--forest);
      font-family: var(--serif);
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0;
    }
    .item-body {
      padding: 18px;
      border-bottom: 0;
    }
    .item-body h3 { margin: 10px 0 7px; font-size: 23px; line-height: 1.3; }
    .tag {
      min-height: 23px;
      padding: 1px 7px;
      border: 1px solid rgba(23, 63, 49, 0.24);
      border-radius: 2px;
      background: transparent;
    }
    .price { font-family: var(--sans); font-size: 14px; font-variant-numeric: tabular-nums; }

    .dense-layout { grid-template-columns: 210px minmax(0, 1fr); gap: 28px; }
    .filter-panel {
      padding: 18px 0;
      border: 0;
      border-top: 1px solid var(--ink);
      border-bottom: 1px solid var(--line);
      border-radius: 0;
      background: transparent;
    }
    .filter-panel label { min-height: 36px; display: flex; align-items: center; }
    .panel {
      border: 0;
      border-top: 1px solid var(--line);
      border-radius: 0;
      background: transparent;
    }
    .list-row {
      grid-template-columns: 110px minmax(0, 1fr) 120px;
      padding: 18px 0;
      background: transparent;
    }
    .list-row:first-child { border-radius: 0; }
    .list-row:last-child { border-radius: 0; }
    .list-thumb {
      position: relative;
      overflow: hidden;
      width: 110px;
      height: 82px;
      border-radius: 10px;
      background: var(--sage);
      box-shadow: inset 0 0 0 1px rgba(23, 63, 49, 0.14);
    }
    .list-thumb img { width: 100%; height: 100%; object-fit: cover; }

    .mosaic {
      grid-auto-rows: 220px;
      gap: 14px;
      border: 0;
      background: transparent;
    }
    .mosaic-card { border: 0; border-radius: 18px; }
    .mosaic-card:nth-child(1) { background: var(--forest); }
    .mosaic-card:nth-child(2) { background: #dfcdb3; }
    .mosaic-card:nth-child(3) { background: #cbdac5; }
    .mosaic-card:nth-child(4) { background: #dfbda9; }
    .mosaic-card small { z-index: 2; font-family: var(--sans); letter-spacing: 0.04em; }
    .mosaic-card h3 { z-index: 2; }
    .mosaic-card.has-photo { color: #fff; }
    .mosaic-card.has-photo::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(13, 37, 49, 0.02), rgba(13, 37, 49, 0.74));
    }
    .mosaic-card img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .detail-grid { grid-template-columns: minmax(0, 1.4fr) minmax(310px, 0.62fr); gap: 30px; }
    .gallery {
      border-radius: 16px;
      background: #d8e8df;
      box-shadow: inset 0 0 0 1px rgba(23, 63, 49, 0.18);
    }
    .gallery-main { background: #d7e9df; }
    .gallery-thumbs { background: transparent; padding: 10px 0 0; }
    .thumb { border: 1px solid rgba(23, 63, 49, 0.2); border-radius: 2px; }
    .sticky-action { border-top: 3px solid var(--forest); background: var(--surface); }
    .action-block { padding: 25px 0 0; }
    .panel-pad { padding: 26px 28px; }
    .panel.panel-pad { border: 1px solid var(--line); border-top: 3px solid var(--forest); background: var(--surface); }
    .handover-box { border: 1px solid var(--line); border-radius: 2px; background: #eef2e7; }
    .progress { border-radius: 0; background: #ddd7ca; }
    .progress { overflow: hidden; }
    .progress > span {
      width: var(--progress, 0%);
      border-radius: 0;
      background: linear-gradient(90deg, var(--forest), #60a592);
      transform-origin: left;
    }

    .field input,
    .field select,
    .field textarea {
      min-height: 48px;
      border-color: var(--line-strong);
      border-radius: 2px;
      background: var(--surface);
    }
    .upload-box { border-color: var(--line-strong); border-radius: 2px; background: rgba(251, 248, 240, 0.5); }

    .charity-hero {
      position: relative;
      overflow: hidden;
      display: block;
      min-height: 460px;
      padding: 0;
      border-radius: 18px;
      background: var(--forest-deep);
    }
    .charity-copy {
      position: relative;
      z-index: 2;
      display: flex;
      min-height: 460px;
      max-width: 760px;
      flex-direction: column;
      justify-content: center;
      padding: 48px 52px;
    }
    .charity-copy p { max-width: 58ch; color: #eef6f7; }
    .charity-copy .btn-primary { color: var(--forest-deep); background: #fff; }
    .charity-copy .btn-secondary { color: #fff; border-color: rgba(255, 255, 255, 0.72); }
    .charity-copy .btn-secondary:hover { color: var(--forest-deep); background: #fff; }
    .charity-media {
      position: absolute;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      min-height: 0;
      border-radius: inherit;
      background: var(--forest-deep);
    }
    .charity-media video,
    .charity-media img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .charity-media::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(90deg, rgba(9, 27, 37, 0.94) 0%, rgba(10, 34, 46, 0.82) 43%, rgba(10, 34, 46, 0.2) 100%),
        linear-gradient(0deg, rgba(9, 27, 37, 0.68), transparent 42%);
    }
    .charity-media figcaption {
      position: absolute;
      left: auto;
      right: 20px;
      bottom: 16px;
      z-index: 2;
      display: flex;
      justify-content: space-between;
      gap: 16px;
      width: min(430px, calc(100% - 40px));
      color: #eff7f8;
      font-size: 11px;
    }
    .charity-media figcaption span:first-child {
      padding: 3px 7px;
      border: 1px solid rgba(255, 255, 255, 0.56);
      border-radius: 999px;
      background: rgba(13, 39, 51, 0.42);
    }
    .charity-grid { gap: 28px; }
    .charity-grid .panel { background: var(--surface); padding: 26px; border: 1px solid var(--line); border-top: 3px solid var(--forest); }
    .video-toggle {
      position: absolute;
      right: 16px;
      top: 16px;
      z-index: 3;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      padding: 0;
      border: 1px solid rgba(255, 255, 255, 0.72);
      border-radius: 50%;
      background: rgba(13, 39, 51, 0.64);
      color: #fff;
      backdrop-filter: blur(8px);
    }
    .video-toggle .ui-icon { width: 18px; height: 18px; }
    .school-media-toggle {
      overflow: hidden;
      padding: 0;
      border: 0;
      background: #fff;
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.72);
    }
    .school-media-toggle .school-badge {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
    }
    .school-media-toggle[aria-pressed="false"] .school-badge { opacity: 0.78; }
    .hero-note .video-toggle {
      border-color: rgba(255, 255, 255, 0.72);
      background: rgba(13, 39, 51, 0.58);
    }

    .editorial-story {
      display: grid;
      grid-template-columns: minmax(210px, 0.74fr) minmax(0, 1.16fr) minmax(190px, 0.78fr);
      grid-template-rows: 195px 170px;
      gap: 14px;
      margin: 42px 0 8px;
    }
    .editorial-copy,
    .editorial-photo,
    .editorial-quote {
      position: relative;
      overflow: hidden;
      border-radius: 16px;
    }
    .editorial-copy {
      grid-row: span 2;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 26px;
      border: 1px solid var(--line);
      background: var(--surface);
    }
    .editorial-copy h2 {
      margin: 12px 0;
      font-family: var(--serif);
      font-size: clamp(26px, 2.5vw, 32px);
      line-height: 1.25;
    }
    .editorial-copy p { margin: 0; color: var(--muted); }
    .editorial-copy .btn { align-self: flex-start; }
    .editorial-photo { margin: 0; background: #dbe9e6; }
    .editorial-photo.tall { grid-row: span 2; }
    .editorial-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 600ms cubic-bezier(0.22, 1, 0.36, 1);
    }
    .editorial-photo::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, transparent 46%, rgba(11, 35, 46, 0.82));
    }
    .editorial-photo figcaption {
      position: absolute;
      z-index: 2;
      left: 18px;
      right: 18px;
      bottom: 16px;
      color: #fff;
    }
    .editorial-photo figcaption b { display: block; font-family: var(--serif); font-size: 21px; }
    .editorial-photo figcaption small { display: block; margin-top: 5px; color: #e5eff1; font-size: 10px; }
    .editorial-quote {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px;
      color: #fff;
      background: var(--forest-deep);
    }
    .editorial-quote p { margin: 0; font-family: var(--serif); font-size: 24px; line-height: 1.4; }

            <p class="identity-help" id="identity-help">选择学校和校区后，使用学号或手机号登录。</p>
            <button class="btn btn-primary" type="submit">继续登录</button>
          </form>
          <p class="muted-note">公益管理员、平台管理员和校级管理员均不能自主注册。</p>
        </section>
      </main>`;

    const selectedUniversity = (code) =>
      universityData.find((university) => university.schoolCode === code) || universityData[0];

    const contextPage = () => {
      const schoolCode = params.get("school") || "4151010610";
      const university = selectedUniversity(schoolCode);
      if (!university) return rolePage();
      const campusCampuses = university.campuses || [];
      return `
        <main class="auth-page">
          ${authStory()}
          <section class="auth-content">
            <a class="back-link" href="?view=role">${uiIcon("back")}返回身份选择</a>
            <h2>先选择你的学校与校区</h2>
            <p>平台会校验注册和登录账号是否属于所选学校，跨校数据不可见。</p>
            <div class="context-box">
              <label for="school-search" style="font-weight:700">学校</label>
              <input id="school-search" class="school-select" style="margin-top:7px"
                     type="search" list="school-options" value="${university.name}"
                     placeholder="输入关键词搜索学校，如“四川”"
                     autocomplete="off" aria-label="搜索并选择学校">
              <datalist id="school-options">
                ${universityData.map((item) => `<option value="${item.name}"></option>`).join("")}
              </datalist>
              <div class="context-school-meta">
                <span class="tag">城市：${university.city}</span>
                <span class="tag">${university.educationLevel === "undergraduate" ? "本科" : "专科"}</span>
              </div>
              <div style="font-weight:700">校区</div>
              <div class="campus-options">
                ${campusCampuses.map((campus, index) => `
                  <a class="campus-option ${index === 0 ? "selected" : ""}"
                     href="?view=login&role=student&school=${encodeURIComponent(university.schoolCode)}&campus=${encodeURIComponent(campus.code)}">
                    ${campus.name}
                  </a>`).join("")}
              </div>
              <p style="margin:18px 0 0;color:var(--muted);font-size:13px">
                选择校区后进入登录。单校区高校的校区选项显示学校全称。当前临时库收录四川省 141 所普通高校。
              </p>
            </div>
          </section>
        </main>`;
    };

    const loginPage = () => {
      const config = roleConfig[loginRole] || roleConfig.student;
      const schoolCode = params.get("school") || "4151010610";
      const campusCode = params.get("campus") || "WANGJIANG";
      const university = selectedUniversity(schoolCode);
      const campus = university?.campuses?.find((item) => item.code === campusCode) || university?.campuses?.[0];
      const registration = loginRole === "student"
        ? `<p style="text-align:center">还没有账号,<a href="?view=register&school=${encodeURIComponent(schoolCode)}&campus=${encodeURIComponent(campusCode)}"><b>前往注册</b></a></p>`
        : loginRole === "station"
          ? '<p class="muted-note">账号由平台管理员统一导入，不开放自主注册。</p>'
          : loginRole === "admin"
            ? '<p class="muted-note">平台管理员账号由系统预设，不开放自主注册。</p>'
            : '<p class="muted-note">账号由平台管理员统一导入，校级管理功能暂未开放。</p>';
      return `
        <main class="login-page">
          <section class="login-art">
            <img class="auth-photo" src="../assets/photos/campus-students-george-pak-7972324.jpg" alt="几名大学生走在校园里">
            <div class="brand" style="color:#fff"><span class="brand-mark"></span>青禾流转</div>
            <div>
              <h1>让每一件好物，<br>都遇见下一位需要的人</h1>
              <p>校园物品共享流转与绿色回收平台</p>
            </div>
            <small>校园旧物的下一段故事 · 从一次登录开始</small>
          </section>
          <section class="login-panel">
            <a class="back-link" href="?view=role">${uiIcon("back")}更换登录身份</a>
            ${loginRole === "student" && university
              ? `<div class="login-context">${university.name} · ${campus?.name || university.name}</div>`
              : `<div class="login-context">${config.name}</div>`}
            <h2>${config.heading}</h2>
            <p>${config.note}</p>
            <div class="field"><label for="login-account">${config.field}</label><input id="login-account" autocomplete="username" placeholder="请输入${config.field}"></div>
            <div class="field"><label for="login-password">密码</label><input id="login-password" type="password" autocomplete="current-password" value="password"></div>
            <button class="btn btn-primary" style="width:100%">登录</button>
            <div class="divider"></div>
            ${registration}
          </section>
        </main>`;
    };

    const registerPage = () => {
      const schoolCode = params.get("school") || "4151010610";
      const campusCode = params.get("campus") || "WANGJIANG";
      const university = selectedUniversity(schoolCode);
      const campus = university?.campuses?.find((item) => item.code === campusCode) || university?.campuses?.[0];
      return `
        <main class="login-page">
          <section class="login-art">
            <img class="auth-photo" src="../assets/photos/campus-students-george-pak-7972324.jpg" alt="几名大学生走在校园里">
            <div class="brand" style="color:#fff"><span class="brand-mark"></span>青禾流转</div>
            <div>
              <h1>让每一件好物，<br>都遇见下一位需要的人</h1>
              <p>校园物品共享流转与绿色回收平台</p>
            </div>
            <small>校园旧物的下一段故事 · 从一次登录开始</small>
          </section>
          <section class="login-panel">
            <a class="back-link"
               href="?view=login&role=student&school=${encodeURIComponent(schoolCode)}&campus=${encodeURIComponent(campusCode)}">${uiIcon("back")}返回学生登录</a>
            <div class="login-context">${university.name} · ${campus?.name || university.name}</div>
            <h2>学生注册</h2>
            <p>注册信息将与学校导入的学生名单核验，只有学号和手机号匹配才能创建账号。</p>
            <div class="two-col">
              <div class="field"><label for="register-student-no">学号</label><input id="register-student-no" placeholder="请输入学号"></div>
              <div class="field"><label for="register-phone">手机号</label><input id="register-phone" type="tel" autocomplete="tel" placeholder="请输入手机号"></div>
            </div>
            <div class="field"><label for="register-password">设置密码</label><input id="register-password" type="password" autocomplete="new-password" value="password"></div>
            <div class="field"><label for="register-password-confirm">确认密码</label><input id="register-password-confirm" type="password" autocomplete="new-password" value="password"></div>
            <button class="btn btn-primary" style="width:100%">提交注册</button>
            <p class="muted-note">手机号不匹配时，请联系辅导员更改学校预留号码。</p>
          </section>
        </main>`;
    };

    const views = {
      role: rolePage,
      context: contextPage,
      discover: () => variant === "B" ? discoveryB() : variant === "C" ? discoveryC() : discoveryA(),
      item: itemDetail,
      create: createItem,
      request: requestDetail,
      charity: charityPage,
      donate: donatePage,
      station: stationDashboard,
      admin: adminDashboard,
      login: loginPage,
      register: registerPage
    };

    if (!views[view]) {
      location.replace("?view=role");
    } else {
      app.innerHTML = views[view]();
    }

    if (view === "context") {
      const schoolSearch = document.querySelector("#school-search");
      const schoolOptions = document.querySelector("#school-options");
      const renderSchoolOptions = (query) => {
        const normalized = query.trim().toLocaleLowerCase("zh-CN");
        const matches = normalized
          ? universityData.filter((item) => item.name.toLocaleLowerCase("zh-CN").startsWith(normalized))
          : universityData;
        schoolOptions.innerHTML = matches.map((item) => `<option value="${item.name}"></option>`).join("");
      };
      const selectSchool = () => {
        const university = universityData.find((item) => item.name === schoolSearch?.value.trim());
        if (university) {
          location.href = `?view=context&role=student&school=${encodeURIComponent(university.schoolCode)}`;
        }
      };
      schoolSearch?.addEventListener("input", (event) => renderSchoolOptions(event.target.value));
      schoolSearch?.addEventListener("change", selectSchool);
      schoolSearch?.addEventListener("keydown", (event) => {
        if (event.key === "Enter") selectSchool();
      });
    }

    if (view === "role") {
      const identityForm = document.querySelector("#identity-form");
      const identitySelect = document.querySelector("#identity-select");
      const identityHelp = document.querySelector("#identity-help");
      identitySelect?.addEventListener("change", () => {
        identityHelp.textContent = identityDescriptions[identitySelect.value];
        if (!matchMedia("(prefers-reduced-motion: reduce)").matches) {
          identityHelp.animate(
            [{ opacity: 0.4 }, { opacity: 1 }],
            { duration: 180, easing: "ease-out" }
          );
        }
      });
      identityForm?.addEventListener("submit", (event) => {
        event.preventDefault();
        location.href = identityRoutes[identitySelect.value];
      });
    }

    const motionPreference = matchMedia("(prefers-reduced-motion: reduce)");
    document.querySelectorAll("[data-school-scene]").forEach((scene) => {
      const toggle = scene.parentElement?.querySelector("[data-school-media-toggle]");
      if (!toggle) return;
      const sceneLabel = scene.alt || "校园";
      const syncSchoolScene = () => {
        const isPlaying = !scene.classList.contains("is-paused");
        toggle.setAttribute("aria-pressed", String(isPlaying));
        toggle.setAttribute("aria-label", isPlaying ? `暂停${sceneLabel}动画` : `播放${sceneLabel}动画`);
        toggle.title = isPlaying ? "暂停校园动画" : "播放校园动画";
      };
      if (capture || motionPreference.matches) scene.classList.add("is-paused");
      toggle.disabled = motionPreference.matches;
      toggle.addEventListener("click", () => {
        scene.classList.toggle("is-paused");
        syncSchoolScene();
      });
      syncSchoolScene();
    });

    for (const videoPlayer of document.querySelectorAll("[data-video-player]")) {
      const videoToggle = videoPlayer.parentElement?.querySelector("[data-video-toggle]");
      if (!videoToggle) continue;
      const sceneLabel = videoPlayer.dataset.videoLabel || "场景";
      const syncVideoButton = () => {
        const isPlaying = !videoPlayer.paused && !videoPlayer.ended && videoPlayer.readyState >= 2;
        videoToggle.innerHTML = uiIcon(isPlaying ? "pause" : "play");
        videoToggle.setAttribute("aria-label", isPlaying ? `暂停${sceneLabel}视频` : `播放${sceneLabel}视频`);
        videoToggle.setAttribute("aria-pressed", String(isPlaying));
      };
      videoPlayer.addEventListener("play", syncVideoButton);
      videoPlayer.addEventListener("pause", syncVideoButton);
      videoToggle.addEventListener("click", () => {
        if (videoPlayer.paused) {
          videoPlayer.play().catch(syncVideoButton);
        } else {
          videoPlayer.pause();
        }
      });
      if (!capture && !motionPreference.matches && videoPlayer.dataset.videoAutoplay !== "false") {
        videoPlayer.play().then(syncVideoButton).catch(syncVideoButton);
      }
      syncVideoButton();
    }

    const hero = document.querySelector(".hero-a");
    const heroNote = hero?.querySelector(".hero-note");
    if (hero && heroNote && matchMedia("(pointer: fine)").matches && !motionPreference.matches) {
      hero.addEventListener("pointermove", (event) => {
        const rect = hero.getBoundingClientRect();
        heroNote.style.setProperty("--glow-x", `${((event.clientX - rect.left) / rect.width) * 100}%`);
        heroNote.style.setProperty("--glow-y", `${((event.clientY - rect.top) / rect.height) * 100}%`);
      });
    }

    if (!capture && !matchMedia("(prefers-reduced-motion: reduce)").matches) {
      document.body.classList.add("motion-ready");
      const cards = [...document.querySelectorAll(".item-card")];
      const reveals = [...document.querySelectorAll(".reveal")];
      if ("IntersectionObserver" in window) {
        const observer = new IntersectionObserver((entries) => {
          for (const entry of entries) {
            if (!entry.isIntersecting) continue;
            entry.target.classList.add("is-visible");
            observer.unobserve(entry.target);
          }
        }, { rootMargin: "0px 0px -8% 0px", threshold: 0.08 });
        [...cards, ...reveals].forEach((element) => observer.observe(element));
      } else {
        cards.forEach((card) => card.classList.add("is-visible"));
        reveals.forEach((element) => element.classList.add("is-visible"));
      }
    }

    if (!capture) {
      bar.classList.remove("hidden");
      const label = document.querySelector("#variant-label");
      const select = document.querySelector("#view-select");
      select.value = view;
      label.textContent = view === "discover" ? `${variant} · ${variantNames[variant]}` : `页面 · ${select.options[select.selectedIndex].text}`;
      select.addEventListener("change", () => {
        const next = new URLSearchParams({ view: select.value });
        if (select.value === "discover") next.set("variant", variant);
        location.href = `?${next.toString()}`;
      });
      const cycle = (step) => {
        if (view !== "discover") return;
        const keys = Object.keys(variantNames);
        const index = keys.indexOf(variant);
        const next = keys[(index + step + keys.length) % keys.length];
        location.href = `?view=discover&variant=${next}`;
      };
      document.querySelector("#prev-variant").addEventListener("click", () => cycle(-1));
      document.querySelector("#next-variant").addEventListener("click", () => cycle(1));
      window.addEventListener("keydown", (event) => {
        if (event.target.matches("input, textarea, select, [contenteditable]")) return;
        if (event.key === "ArrowLeft") cycle(-1);
        if (event.key === "ArrowRight") cycle(1);
      });
    }
  </script>
</body>
</html>
